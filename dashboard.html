<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .dashboard-header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .dashboard-header h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .dashboard-header p {
            color: #666;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .stat-card .value {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .chart-card.full-width {
            grid-column: 1 / -1;
        }

        .chart-container {
            position: relative;
            height: 400px;
        }

        .chart-container.small {
            height: 300px;
        }

        .logout-btn {
            background: #f44336;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: #d32f2f;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .nav-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s;
        }

        .nav-btn:hover {
            background: #5568d3;
        }

        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1>📊 Your Mood Analytics Dashboard</h1>
            <p>Track your mental wellness journey over time</p>
            <div class="nav-buttons">
                <a href="index.html" class="nav-btn">Take Assessment</a>
                <a href="chatbot-integration.html" class="nav-btn">Talk to Chatbot</a>
                <button onclick="logout()" class="logout-btn">Logout</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Entries</h3>
                <div class="value" id="totalEntries">-</div>
            </div>
            <div class="stat-card">
                <h3>Average Score</h3>
                <div class="value" id="averageScore">-</div>
            </div>
            <div class="stat-card">
                <h3>Current Mood</h3>
                <div class="value" id="currentMood" style="font-size: 24px;">-</div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card full-width">
                <h2 style="margin-bottom: 20px; color: #333;">Mood Trend Over Time</h2>
                <div class="chart-container">
                    <canvas id="moodLineChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h2 style="margin-bottom: 20px; color: #333;">Recent Mood Scores</h2>
                <div class="chart-container small">
                    <canvas id="moodBarChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h2 style="margin-bottom: 20px; color: #333;">Mood Distribution</h2>
                <div class="chart-container small">
                    <canvas id="moodDoughnutChart"></canvas>
                </div>
            </div>

            <div class="chart-card full-width">
                <h2 style="margin-bottom: 20px; color: #333;">Question Analysis</h2>
                <div class="chart-container small">
                    <canvas id="questionRadarChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="charts.js"></script>
    <script>
        

        // Load and display stats
        async function loadStats() {
            try {
                const stats = await getMoodStats();
                
                document.getElementById('totalEntries').textContent = stats.totalEntries || 0;
                document.getElementById('averageScore').textContent = stats.averageScore || '-';
                
                if (stats.recentEntries && stats.recentEntries.length > 0) {
                    document.getElementById('currentMood').textContent = stats.recentEntries[0].moodLevel;
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Initialize everything
        document.addEventListener('DOMContentLoaded', async () => {
            await loadStats();
            await initializeCharts();
        });
    </script>
</body>
</html>
